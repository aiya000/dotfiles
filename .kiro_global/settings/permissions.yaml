# NOTE: Replace {FOO} to your value to use this setting

# WARNING: Do not apply this config to Kiro and open a public repository (i.e. one that accepts
# PRs from untrusted contributors) with it.
#
# Reason: several allow rules below have a fixed command name, but the content that actually
# gets executed depends on the repo's diff (i.e. a PR). A malicious PR can plant that content
# and Kiro will run it as-is:
#
#   - bun install              : auto-runs pre/postinstall scripts of any dependency added to
#                                package.json / the lockfile
#   - pnpm exec vitest --run *, pnpm exec vitest run *, lib/bats/bin/bats *
#                               : executes the contents of test files as JS/bash
#   - pnpm run format|lint|type-check, bun run eslint|lint|typecheck
#                               : the command name is fixed, but the actual script body comes
#                                 from package.json's "scripts" field (part of the PR diff itself)
#   - sed *, awk *              : both support running shell commands (the `e` flag / system())
#   - git apply *                : a crafted patch could in theory write to unintended paths
#
# Only use this config on repos/branches you fully trust.

rules:
  - capability: shell
    effect: allow
    match:
      - "true"
      - ./node_modules/.bin/eslint *
      - /bin/bash --version
      - /opt/homebrew/bin/nvim *
      - /usr/bin/readlink *
      - /usr/bin/wc *
      - awk *
      - bash --version
      - bun install
      - bun run eslint
      - bun run lint
      - bun run typecheck
      - bunx prettier *
      - cat *
      - cd *
      - command *
      - cut *
      - diff *
      - echo *
      - exit *
      - gh --version
      - gh auth status
      - gh auth status --active
      - gh issue create *
      - gh issue list *
      - gh issue view *
      - gh label list *
      - gh pr checks *
      - gh pr create *
      - gh pr list *
      - gh pr view *
      - gh repo list *
      - gh repo view *
      - git add *
      - git apply *
      - git branch --list *
      - git branch --show-current
      - git branch -r --list *
      - git check-ignore *
      - git checkout *
      - git commit *
      - git config --get *
      - git diff *
      - git fetch *
      - git mv *
      - git push *
      - git show *
      - git stash *
      - git status *
      - git switch *
      - head *
      - jq *
      - lib/bats/bin/bats *
      - ln *
      - ls *
      - luac *
      - mkdir *
      - mktemp *
      - nl *
      - node --version
      - nvim *
      - pnpm exec eslint *
      - pnpm exec nuxi prepare
      - pnpm exec nuxt prepare
      - pnpm exec prettier *
      - pnpm exec vitest --run *
      - pnpm exec vitest run *
      - pnpm run format
      - pnpm run lint
      - pnpm run type-check
      - printf *
      - ps *
      - ps-mem *
      - readlink *
      - rg *
      - rm-dust *
      - sed *
      - shellcheck *
      - sort *
      - stylua *
      - tail *
      - test *
      - top *
      - type *
      - wc *
      - whence *
      - which *
  - capability: fs_read
    effect: allow
    match:
      - /private/tmp/**
      - {YOUR-HOME}/.ai-memory/**
      - {YOUR-HOME}/.dotfiles/**
      - {YOUR-HOME}/.dotfiles/AGENTS.global.md
      - {YOUR-HOME}/.kiro/**
      - {YOUR-HOME}/.local/**
      - {YOUR-HOME}/AGENTS.local.md
  - capability: fs_write
    effect: allow
    match:
      - {YOUR-HOME}/.ai-memory/**
      - {YOUR-HOME}/.dotfiles/.kiro_global/**
      - {YOUR-HOME}/.dotfiles/AGENTS.global.md
      - {YOUR-HOME}/AGENTS.local.md
  - capability: web_fetch
    effect: allow
    match:
      - agentskills.io
  - capability: skill
    effect: allow
    match:
      - apply-pr-review
      - create-this-issue
      - define-markdown-format
      - fd
      - git-add
      - git-commit
      - git-verify-identity
      - github-pr-create
      - rg
      - rm-dust
      - save-memory
      - suggest-alternative-commands
      - sync-labels-from-prs-and-sub-issues
      - verify-git-command-location
  - capability: shell
    effect: deny
    match:
      - find *
      - grep *
      - rm *
  - capability: web_search
    effect: allow
  - capability: subagent
    effect: allow
    match:
      - semantic_reviewer
