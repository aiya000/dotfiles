# NOTE: Replace {FOO} to your value to use this setting

rules:
  - capability: shell
    effect: allow
    match:
      - "true"
      - ./node_modules/.bin/eslint *
      - /bin/bash --version
      - /opt/homebrew/bin/nvim *
      - /usr/bin/readlink *
      - /usr/bin/wc *
      - awk *
      - bash --version
      - bun install
      - bun run eslint
      - bun run lint
      - bun run typecheck
      - bunx prettier *
      - cat *
      - cd *
      - command *
      - cut *
      - echo *
      - exit *
      - gh --version
      - gh auth status
      - gh issue view *
      - gh label list *
      - gh pr checks *
      - gh pr list *
      - gh pr view *
      - gh repo list *
      - gh repo view *
      - git add *
      - git apply *
      - git branch --show-current
      - git check-ignore *
      - git commit *
      - git config --get *
      - git diff *
      - git mv *
      - git show *
      - git stash *
      - git status *
      - git switch *
      - head *
      - jq *
      - lib/bats/bin/bats *
      - ln *
      - ls *
      - luac *
      - mkdir *
      - mktemp *
      - node --version
      - nvim *
      - pnpm exec eslint *
      - pnpm exec prettier *
      - pnpm run format
      - pnpm run lint
      - pnpm run type-check
      - printf *
      - ps *
      - ps-mem *
      - readlink *
      - rg *
      - rm-dust *
      - sed *
      - shellcheck *
      - sort *
      - source ./source-all.sh
      - stylua *
      - tail *
      - test *
      - top *
      - type *
      - wc *
      - whence *
      - which *
  - capability: fs_read
    effect: allow
    match:
      - /private/tmp/**
      - {YOUR-HOME}/.ai-memory/**
      - {YOUR-HOME}/.dotfiles/**
      - {YOUR-HOME}/.kiro/**
  - capability: web_fetch
    effect: allow
    match:
      - agentskills.io
  - capability: skill
    effect: allow
    match:
      - apply-pr-review
      - create-this-issue
      - define-markdown-format
      - fd
      - git-add
      - git-commit
      - git-verify-identity
      - github-pr-create
      - rg
      - rm-dust
      - save-memory
      - suggest-alternative-commands
      - sync-labels-from-prs-and-sub-issues
      - verify-git-command-location
  - capability: shell
    effect: deny
    match:
      - find *
      - grep *
      - rm *
  - capability: fs_write
    effect: allow
    match:
      - {YOUR-HOME}/.ai-memory/**
      - {YOUR-HOME}/.dotfiles/.kiro_global/**
      - {YOUR-HOME}/.dotfiles/AGENTS.global.md
  - capability: web_search
    effect: allow
  - capability: subagent
    effect: allow
    match:
      - semantic_reviewer
